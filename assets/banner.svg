<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A12" />
      <stop offset="55%" stop-color="#0D0221" />
      <stop offset="100%" stop-color="#0A0A12" />
    </linearGradient>

    <linearGradient id="cyanMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7B2FF7" />
      <stop offset="100%" stop-color="#FF2A6D" />
    </linearGradient>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7B2FF7" stroke-width="0.6" stroke-opacity="0.22" />
    </pattern>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.06" />
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .hud-text { font-family: 'Courier New', Courier, monospace; font-weight: 700; letter-spacing: 3px; }
      .title-main { font-family: 'Courier New', Courier, monospace; font-weight: 900; font-size: 56px; letter-spacing: 6px; fill: #00F0FF; }
      .title-glitch-m { font-family: 'Courier New', Courier, monospace; font-weight: 900; font-size: 56px; letter-spacing: 6px; fill: #FF2A6D; opacity: 0.75; animation: glitchM 3.2s infinite; }
      .title-glitch-p { font-family: 'Courier New', Courier, monospace; font-weight: 900; font-size: 56px; letter-spacing: 6px; fill: #7B2FF7; opacity: 0.7; animation: glitchP 2.7s infinite; }
      .subtitle { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 15px; letter-spacing: 4px; fill: #FFFFFF; }
      .blink { animation: pulse 1.4s infinite; }
      @keyframes glitchM {
        0%, 88%, 100% { transform: translate(0, 0); opacity: 0; }
        90% { transform: translate(-4px, 2px); opacity: 0.85; }
        93% { transform: translate(4px, -2px); opacity: 0.85; }
        96% { transform: translate(-2px, 0); opacity: 0.4; }
      }
      @keyframes glitchP {
        0%, 82%, 100% { transform: translate(0, 0); opacity: 0; }
        84% { transform: translate(5px, 1px); opacity: 0.75; }
        87% { transform: translate(-3px, -2px); opacity: 0.75; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
    </style>
  </defs>

  <!-- Background & Grid -->
  <rect width="900" height="250" fill="url(#bgGrad)" />
  <rect width="900" height="250" fill="url(#cyberGrid)" />

  <!-- Outer HUD Frame -->
  <rect x="12" y="12" width="876" height="226" fill="none" stroke="#7B2FF7" stroke-width="1.5" stroke-opacity="0.6" />
  <polyline points="12,42 12,12 42,12" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#neonGlow)" />
  <polyline points="858,12 888,12 888,42" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#neonGlow)" />
  <polyline points="12,208 12,238 42,238" fill="none" stroke="#FF2A6D" stroke-width="3" filter="url(#neonGlow)" />
  <polyline points="858,238 888,238 888,208" fill="none" stroke="#FF2A6D" stroke-width="3" filter="url(#neonGlow)" />

  <!-- Acid Yellow Warning Accents -->
  <rect x="28" y="24" width="10" height="10" fill="#FCEE0A" class="blink" />
  <text x="46" y="33" class="hud-text" font-size="11" fill="#FCEE0A">SYS.NODE // OMEGARYUJIN_OS v2.0.77</text>
  <text x="680" y="33" class="hud-text" font-size="11" fill="#00F0FF">[ NEURAL_LINK: ESTABLISHED ]</text>

  <!-- Glitch Layered Title -->
  <text x="450" y="125" text-anchor="middle" class="title-glitch-p">OMEGARYUJIN</text>
  <text x="450" y="125" text-anchor="middle" class="title-glitch-m">OMEGARYUJIN</text>
  <text x="450" y="125" text-anchor="middle" class="title-main" filter="url(#neonGlow)">OMEGARYUJIN</text>

  <!-- Neon Divider Line -->
  <line x1="170" y1="148" x2="730" y2="148" stroke="url(#cyanMagenta)" stroke-width="2" />
  <rect x="435" y="145" width="30" height="6" fill="#FCEE0A" />

  <!-- Role / Tagline -->
  <text x="450" y="180" text-anchor="middle" class="subtitle">
    &gt;&gt; FULL-STACK DEV &amp; TOOL BUILDER &lt;&lt;
  </text>

  <!-- Bottom Telemetry -->
  <text x="28" y="224" class="hud-text" font-size="10" fill="#FF2A6D">LOC :: NIGHT_CITY_SECTOR_07</text>
  <text x="450" y="224" text-anchor="middle" class="hud-text" font-size="10" fill="#7B2FF7">STACK :: JS // PY // REACT // TAILWIND</text>
  <text x="872" y="224" text-anchor="end" class="hud-text" font-size="10" fill="#00F0FF">STATUS :: ONLINE</text>

  <!-- Animated Scanbar -->
  <rect x="0" y="-30" width="900" height="25" fill="#00F0FF" opacity="0.06">
    <animate attributeName="y" from="-30" to="260" dur="5s" repeatCount="indefinite" />
  </rect>
  <rect width="900" height="250" fill="url(#scanlines)" pointer-events="none" />
</svg>
