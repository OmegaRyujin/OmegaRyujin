name: Generate Cyberpunk Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate cyberpunk neon snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#FCEE0A&color_dots=#0D0221,#2A0944,#7B2FF7,#FF2A6D,#00F0FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FCEE0A&color_dots=#0D0221,#2A0944,#7B2FF7,#FF2A6D,#00F0FF

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
